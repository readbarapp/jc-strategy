name: HKJC Monitor

on:
  schedule:
    # Detector: every 30 minutes during hours when a HK meeting can still be live.
    # 09:00–00:30 HKT = 01:00–16:30 UTC. Each tick asks HKJC for today's meeting
    # and that day's official first postTime — not a hardcoded 11:00 / 17:30.
    - cron: "0,30 1-16 * * *"
    # Extra results harvest 00:20 HKT in case night racing finished after the monitor job.
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "auto | monitor | results | once | test-telegram | demo-data"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - monitor
          - results
          - once
          - test-telegram
          - demo-data
      race_date:
        description: "Optional YYYY-MM-DD (Hong Kong calendar date)"
        required: false
        type: string

concurrency:
  group: hkjc-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

# actions: write lets this job dispatch a successor before the 6-hour runner kill.

jobs:
  monitor:
    name: Collect odds / results
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Hong_Kong
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Exit ~30 minutes before GitHub kills the job, then dispatch a continuation.
      HKJC_JOB_BUDGET_SECONDS: "19800"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          CMD="${{ github.event.inputs.command }}"
          DATE="${{ github.event.inputs.race_date }}"
          if [ -z "$CMD" ]; then CMD="auto"; fi
          EXTRA=()
          if [ -n "$DATE" ]; then EXTRA+=(--date "$DATE"); fi
          python scraper_runner.py "$CMD" "${EXTRA[@]}"
